services:
  postgres:
    image: postgres:16-alpine
    container_name: rcp-postgres
    environment:
      POSTGRES_DB: rcp_dev
      POSTGRES_USER: rcp_user
      POSTGRES_PASSWORD: rcp_password
    ports:
      - "5432:5432"
    volumes:
      - rcp_postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcp_user -d rcp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rcp_postgres_data:
